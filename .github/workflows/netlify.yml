# 이전 사이트 주소의 리디렉션과 Slack 콜백을 수동으로 갱신합니다.
name: Update legacy Netlify routes
on:
  workflow_dispatch:
concurrency:
  group: netlify
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes netlify-cli@26.0.2 deploy --prod --dir . --no-build --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
