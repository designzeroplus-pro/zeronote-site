# main에 푸시하면 Netlify(zeronote-app)로 자동 배포
name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: netlify
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes netlify-cli@26.0.2 deploy --prod --dir . --no-build --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
